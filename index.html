<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <h1>Ecommerce</h1>
        <nav>
            <input class="search-input" type="search" placeholder="Pesquisar...">
            <ul>
                <li><a href="#">Lorem</a></li>
                <li><a href="#">Lorem</a></li>
                <li><a href="#">Lorem</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <aside>
            <h2>Categorias</h2>
            <ul>
                <li><a href="#">Ovos de Pascoa</a></li>
                <li><a href="#">Chocolate</a></li>
                <li><a href="#">Doces</a></li>
            </ul>
            <div class="carrinho-cesta">
                <h2>Carrinho</h2>
                <a href="/" class="carrinho-cesta" aria-label="Adicionar ao carrinho">
                        <i class="fa fa-shopping-cart" aria-hidden="true"></i>
                        <span class="sr-only">Adicionar ao carrinho</span>
                </a>
            </div>
        </aside>
        <div class="product-list">
            <div class="product">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4z92CwpRRnZTxFq8IJQFrfE-KzK6nm3sL9w&s" alt="" 
                width="140px" height="150">
                <div class="product-info">
                    <p class="description">Ovo de Páscoa Delice Shrek</p>
                    <p class="valor">R$74,99</p>
                    <a href="/" class="carrinho" aria-label="Adicionar ao carrinho">
                        <i class="fa fa-shopping-cart" aria-hidden="true"></i>
                        <span class="sr-only">Adicionar ao carrinho</span>
                    </a>
                </div>
            </div>              
        </div>

    </main>
    <footer>

    </footer>

    <script src="script.js"></script>
</body>
</html>
